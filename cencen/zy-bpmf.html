<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">

<title>注音魔法屋 · ㄅㄆㄇㄈ 示範課</title>
<style>
:root{--ink:#4A2B45;--acc:#FF8FB1;--accD:#E0607F;--accT:#FFE1EC;--blue:#5B9BE0;--blueD:#3C7BC0;--green:#6BC98A;--greenD:#3FA863;--bg:#FFF4F9;--card:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"PingFang TC","Noto Sans TC",system-ui,sans-serif;color:var(--ink);background:
 radial-gradient(1200px 500px at 50% -10%,#FFE7F2 0,rgba(255,231,242,0) 60%),var(--bg);
 padding:14px 5vw 40px;min-height:100vh}
ruby rt{font-size:.5em;color:var(--accD);font-weight:800}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:720px;margin:0 auto 6px}
.ttl{font-size:22px;font-weight:900;color:var(--accD)}
.ttl small{display:block;font-size:13px;opacity:.7;font-weight:700}
.x{font:inherit;font-size:18px;font-weight:900;border:3px solid var(--acc);background:#fff;color:var(--accD);border-radius:999px;padding:7px 16px;cursor:pointer}
.crumbs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;max-width:720px;margin:0 auto 10px}
.crumbs i{width:12px;height:12px;border-radius:50%;background:var(--accT);display:inline-block}
.crumbs i.on{background:var(--acc);transform:scale(1.25)}
.crumbs i.ok{background:var(--green)}
.stage{max-width:720px;margin:0 auto;background:var(--card);border:5px solid var(--accT);border-radius:30px;
 box-shadow:0 10px 0 var(--accT);padding:20px 18px;text-align:center;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.step{font-size:16px;font-weight:900;color:var(--blueD);background:#EAF3FC;border-radius:999px;padding:4px 16px;display:inline-block}
.sym{font-size:150px;font-weight:900;line-height:1;color:var(--ink)}
.symSm{font-size:70px;font-weight:900}
.card-img{font-size:72px}
.word{font-size:30px;font-weight:900}
.say{font-size:20px;font-weight:800;line-height:1.6;max-width:460px}
.mascot{font-size:54px;line-height:1}
.hear{font:inherit;font-size:26px;font-weight:900;border:0;border-radius:999px;padding:16px 30px;background:var(--acc);color:#fff;cursor:pointer;box-shadow:0 7px 0 var(--accD)}
.hear:active{transform:translateY(5px);box-shadow:0 2px 0 var(--accD)}
.go{font:inherit;font-size:24px;font-weight:900;border:0;border-radius:999px;padding:14px 34px;background:var(--blue);color:#fff;cursor:pointer;box-shadow:0 7px 0 var(--blueD)}
.go:active{transform:translateY(5px);box-shadow:0 2px 0 var(--blueD)}
.go.g{background:var(--green);box-shadow:0 7px 0 var(--greenD)}
.go.g:active{box-shadow:0 2px 0 var(--greenD)}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.opts{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.opts button{font:inherit;font-size:80px;font-weight:900;width:130px;height:130px;background:#fff;border:5px solid var(--accT);border-radius:26px;cursor:pointer;color:var(--ink)}
.opts button.yes{border-color:var(--green);background:#E7F7ED}
.opts button.no{border-color:#ccc;opacity:.35}
.hint{font-size:17px;font-weight:800;color:var(--accD);min-height:24px}
.note{font-size:14px;opacity:.7;font-weight:700}
.badge{font-size:13px;color:var(--blueD);background:#EAF3FC;border-radius:999px;padding:3px 12px;font-weight:800}
canvas{touch-action:none;border-radius:22px;background:#fff}
.traceWrap{position:relative;width:260px;height:260px}
.traceWrap .ghost{position:absolute;inset:0;font-size:210px;font-weight:900;color:#FFD7E6;display:flex;align-items:center;justify-content:center;pointer-events:none}
.traceWrap canvas{position:absolute;inset:0;width:260px;height:260px}
.review{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:460px}
.review div{background:#fff;border:4px solid var(--accT);border-radius:20px;padding:10px 4px;font-size:46px;font-weight:900}
.review div .ok{display:block;font-size:20px;color:var(--greenD)}
.credit{max-width:720px;margin:16px auto 0;font-size:12px;line-height:1.7;opacity:.7;text-align:center;word-break:break-all}
.credit a{color:var(--blue)}
.start{max-width:720px;margin:0 auto;text-align:center}
.start .big{font-size:26px;font-weight:900;margin:10px 0 18px}
.mouthSvg{width:230px;height:170px}

.zh{display:inline-flex;align-items:center;vertical-align:middle;margin:0 .14em .06em 0;line-height:1}
.zc{line-height:1;font-size:1.15em}
.zy{display:inline-flex;align-items:center;margin-left:.06em;font-size:.42em;font-weight:800;color:var(--accD);letter-spacing:0}
.zs{display:flex;flex-direction:column;align-items:center;line-height:1.02}
.zt{align-self:flex-end;margin-left:.05em;margin-bottom:.3em;line-height:1}
.zn0{line-height:.6}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:720px;margin:0 auto 10px}
.set{font:inherit;font-size:15px;font-weight:800;border:3px solid var(--accT);background:#fff;color:var(--ink);border-radius:999px;padding:5px 12px;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.set input{width:100px}
.cap{font-size:20px;font-weight:800;line-height:1.5;background:#FFF7FB;border-radius:18px;padding:8px 14px}
.vid{position:relative;width:100%;aspect-ratio:16/9;border-radius:22px;overflow:hidden;background:#222}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%}
.cards button{font:inherit;font-size:76px;font-weight:900;background:#fff;border:5px solid var(--accT);border-radius:26px;cursor:pointer;color:var(--ink);padding:12px 0;display:flex;flex-direction:column;align-items:center;gap:4px}
.cards button small{font-size:18px}
.mouths{display:grid;grid-template-columns:1fr;gap:10px;width:100%}
.mouth{font:inherit;display:grid;grid-template-columns:70px 150px 1fr;align-items:center;gap:8px;background:#fff;border:4px solid var(--accT);border-radius:22px;padding:8px;text-align:left;cursor:pointer;color:var(--ink);font-size:18px;font-weight:800}
.mouth b{font-size:56px;text-align:center}
.mouth .mouthSvg{width:150px;height:110px}
.pics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%}
.pics button{font:inherit;font-size:20px;font-weight:900;background:#fff;border:5px solid var(--accT);border-radius:24px;cursor:pointer;color:var(--ink);padding:10px 4px;display:flex;flex-direction:column;align-items:center}
.pics button span.p{font-size:64px}
.ping{animation:ping .6s}@keyframes ping{50%{transform:scale(1.08);background:#FFF3C4}}
.noanim *{animation:none!important;transition:none!important}
.tabs{display:flex;gap:8px;justify-content:center}
.tabs button{font:inherit;font-size:30px;font-weight:900;width:64px;height:64px;border-radius:18px;border:4px solid var(--accT);background:#fff;cursor:pointer;color:var(--ink)}
.tabs button.on{border-color:var(--acc);background:var(--accT)}
@media (max-width:600px){.cards,.pics{grid-template-columns:1fr 1fr}.mouth{grid-template-columns:56px 110px 1fr}.mouth .mouthSvg{width:110px;height:82px}}
</style>

  if (p && p.step > 0 && p.step < STEPS.length) {
    stage('<div class="mascot" style="font-size:72px">🧚‍♀️</div><div class="say">' + z('上次學到「' + STEPS[p.step] + '」') + '</div>' +
      '<div class="row"><button class="go g" onclick="go(' + p.step + ')">▶ ' + z('從上次繼續') + '</button><button class="go" onclick="go(0)">' + z('從頭開始') + '</button></div>');
  } else go(0);
}
function go(n){
  stopAll(); ST.step = Math.max(0, Math.min(n, STEPS.length - 1)); save(); bar();
  var s = ST.step;
  if (s === 0) {
    stage(head() + cap('先看影片認識ㄅㄆㄇㄈ，看完按「下一步」。') +
      '<div class="vid"><iframe src="https://www.youtube-nocookie.com/embed/' + VID + '?rel=0&playsinline=1&modestbranding=1&cc_load_policy=' + (ST.cap ? 1 : 0) + '&cc_lang_pref=zh-TW&hl=zh-TW" title="ㄅㄆㄇㄈ 注音教學影片" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>' +
      '<div class="note">影片看不到時，可開 <a href="https://www.youtube.com/watch?v=' + VID + '" target="_blank" rel="noopener">原影片</a> 或 <a href="https://market.cloud.edu.tw/resources/video/1841026" target="_blank" rel="noopener">教育部教育雲版本</a>，或直接按下一步。</div>' + nav('下一步'));
  } else if (s === 1) {
    stage(head() + cap('點一點卡片，聽聽看怎麼唸，可以一直重聽喔！') + '<div class="badge">' + z('教育部注音讀音') + '</div>' +
      '<div class="cards">' + ZY.map(function(x){ return '<button data-s="' + x.s + '" onclick="play(\'' + x.s + '\')">' + x.s + '<small>🔊</small></button>'; }).join('') + '</div><div class="hint" id="hint"></div>' + nav('下一步'));
  } else if (s === 2) {
    stage(head() + cap('看看嘴巴怎麼動，點一下可以聽聲音。') +
      '<div class="mouths">' + ZY.map(function(x){ return '<button class="mouth" data-s="' + x.s + '" onclick="play(\'' + x.s + '\')"><b>' + x.s + '</b>' + mouthSvg(x.mt) + '<span>' + z(x.mouth) + '</span></button>'; }).join('') + '</div>' +
      '<div class="note">' + z('嘴型是示意圖，不是真人照片') + '</div><div class="hint" id="hint"></div>' + nav('下一步'));
  } else if (s === 3) {
    stage(head() + cap('先聽一次，再自己大聲唸一次，唸給爸爸媽媽聽。不用錄音喔！') +
      '<div class="cards">' + ZY.map(function(x){ return '<button data-s="' + x.s + '" onclick="play(\'' + x.s + '\')">' + x.s + '<small>🔊 ' + z('聽完跟著唸') + '</small></button>'; }).join('') + '</div><div class="hint" id="hint"></div>' + nav('我唸好了'));
  } else if (s === 4) {
    stage(head() + cap('選一個注音，用手指照著粉紅色的字描一描。') +
      '<div class="tabs">' + ZY.map(function(x, i){ return '<button class="' + (i === TS ? 'on' : '') + '" onclick="TS=' + i + ';go(4)">' + x.s + '</button>'; }).join('') + '</div>' +
      '<div class="traceWrap"><div class="ghost">' + ZY[TS].s + '</div><canvas id="tc" width="260" height="260"></canvas></div>' +
      '<div class="row"><button class="hear" onclick="play(\'' + ZY[TS].s + '\')">🔊 ' + z('聽') + '</button><button class="go" style="background:#aaa;box-shadow:0 7px 0 #888" onclick="traceClear()">' + z('擦掉重描') + '</button></div>' + nav('描好了'));
    traceInit();
  } else if (s === 5 || s === 6) {
    Q.list = shuffle([0, 1, 2, 3]); Q.i = 0; quiz();
  } else if (s === 7) {
    stage(head() + cap('今天認識了ㄅㄆㄇㄈ！點一點，再聽一次。') +
      '<div class="cards">' + ZY.map(function(x){ return '<button data-s="' + x.s + '" onclick="play(\'' + x.s + '\')">' + x.s + '<small>' + x.e + ' ' + z(x.w) + '</small></button>'; }).join('') + '</div><div class="hint" id="hint"></div>' +
      '<div class="row"><button class="go" onclick="go(0)">' + z('再學一次') + '</button><button class="go g" onclick="ST.step=0;save();goApp()">' + z('完成，回大班學習') + '</button></div>');
    say('你好棒！今天認識了ㄅㄆㄇㄈ！');
  }
}
function shuffle(a){ for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function quiz(){
  var x = ZY[Q.list[Q.i]], s = ST.step, h = head() + '<div class="note">' + z('第' + '一二三四'.charAt(Q.i) + '題，共四題') + '</div>';
  if (s === 5) {
    stage(h + cap('聽聲音，選出對的注音。') + '<div class="row"><button class="hear" onclick="play(\'' + x.s + '\')">🔊 ' + z('聽聲音') + '</button></div>' +
      '<div class="cards" id="opts">' + ZY.map(function(o){ return '<button onclick="ans(this,\'' + o.s + '\')">' + o.s + '</button>'; }).join('') + '</div><div class="hint" id="hint"></div>' + nav(''));
    setTimeout(function(){ play(x.s); }, 400);
  } else {
    stage(h + cap('看注音，選出開頭是這個音的圖。') + '<div class="sym" data-s="' + x.s + '" onclick="play(\'' + x.s + '\')" style="cursor:pointer">' + x.s + '</div>' +
      '<div class="pics" id="opts">' + shuffle(ZY.slice()).map(function(o){ return '<button onclick="ans(this,\'' + o.s + '\')"><span class="p">' + o.e + '</span>' + z(o.w) + '</button>'; }).join('') + '</div><div class="hint" id="hint"></div>' + nav(''));
  }
}
function ans(el, choice){
  var x = ZY[Q.list[Q.i]], hint = document.getElementById('hint');
  if (choice === x.s) {
    hint.innerHTML = z('答對了！你好棒！') + ' 🎉'; say('答對了！');
    [].forEach.call(document.querySelectorAll('#opts button'), function(b){ b.onclick = null; });
    setTimeout(function(){ Q.i++; if (Q.i >= Q.list.length) go(ST.step + 1); else quiz(); }, 1200);
  } else {
    hint.innerHTML = z('再聽一次，我們慢慢來') + ' 🙂 <button class="hear" style="font-size:18px;padding:8px 18px" onclick="play(\'' + x.s + '\')">🔊 ' + z('再聽一次') + '</button>';
    say('再聽一次，我們慢慢來');
  }
}

function mouthSvg(mt){
  var lips = '<ellipse cx="115" cy="95" rx="70" ry="14" fill="#E57A95"/>';
  if (mt==='lips') lips = '<path d="M45 95 Q115 88 185 95 Q115 102 45 95 Z" fill="#C85C78"/>';
  if (mt==='puff') lips = '<path d="M45 95 Q115 88 185 95 Q115 102 45 95 Z" fill="#C85C78"/><path d="M188 95 q22 -6 40 0" stroke="#9FC6F0" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M190 108 q24 -4 44 2" stroke="#9FC6F0" stroke-width="6" fill="none" stroke-linecap="round"/>';
  if (mt==='hum') lips = '<path d="M45 95 Q115 88 185 95 Q115 102 45 95 Z" fill="#C85C78"/><text x="150" y="60" font-size="26">🎵</text>';
  if (mt==='teeth') lips = '<ellipse cx="115" cy="98" rx="68" ry="20" fill="#E57A95"/><rect x="60" y="78" width="110" height="16" rx="4" fill="#fff" stroke="#DDD"/><path d="M60 100 Q115 118 170 100" fill="#B84D6A"/>';
  return '<svg class="mouthSvg" viewBox="0 0 230 170"><ellipse cx="115" cy="90" rx="100" ry="78" fill="#FFE0CB"/>'+lips+'</svg>';
}
var TC = { d:false };
function traceInit(){
  var c = document.getElementById('tc'); if(!c) return; var ctx = c.getContext('2d');
  ctx.lineWidth=16; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#FF6FA1';
  function pos(e){ var r=c.getBoundingClientRect(); var t=e.touches?e.touches[0]:e; return {x:(t.clientX-r.left)*c.width/r.width, y:(t.clientY-r.top)*c.height/r.height}; }
  function down(e){ e.preventDefault(); TC.d=true; var p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x+0.1,p.y+0.1); ctx.stroke(); }
  function move(e){ if(!TC.d)return; e.preventDefault(); var p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); }
  function up(){ TC.d=false; }
  c.addEventListener('pointerdown',down); c.addEventListener('pointermove',move); window.addEventListener('pointerup',up);
  c.addEventListener('touchstart',down,{passive:false}); c.addEventListener('touchmove',move,{passive:false}); c.addEventListener('touchend',up);
}
function traceClear(){ var c=document.getElementById('tc'); if(c){ c.getContext('2d').clearRect(0,0,c.width,c.height); } }
start();
</script>
